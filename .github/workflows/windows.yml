name: Windows (EXE)

on:
  workflow_dispatch:
  push:
    branches: [main, santi]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Enable Windows Desktop & Create Platform Wrapper
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package Release
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          if (-not (Test-Path $releaseDir)) {
            $candidate = Get-ChildItem -Path "build\windows" -Filter "runner" -Recurse -Directory | Get-ChildItem -Filter "Release" -Directory | Select-Object -First 1
            if ($candidate) { $releaseDir = $candidate.FullName }
          }
          Write-Host "Directorio Release encontrado: $releaseDir"
          Get-ChildItem -Path $releaseDir

          Compress-Archive -Path "$releaseDir\*" -DestinationPath "CrotoWave-Windows-x64.zip" -Force
          Get-Item "CrotoWave-Windows-x64.zip" | Select-Object Name, Length

      - name: Subir como artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CrotoWave-Windows
          path: CrotoWave-Windows-x64.zip
          retention-days: 1

      - name: Publicar en la release windows-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>$null || $true
          gh release create windows-latest CrotoWave-Windows-x64.zip `
            --target $env:GITHUB_SHA `
            --title "CrotoWave para Windows (última compilación)" `
            --notes "Ejecutable nativo para Windows (x64) compilado desde $($env:GITHUB_SHA.Substring(0, 7)). Descomprimir y ejecutar CrotoWave.exe."
