name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Los tests de Hi-Fi/ecualizador y de waveform usan libmpv y ffmpeg reales.
      - name: Dependencias nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev mpv ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  jam-server:
    name: jam-server (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jam-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jam-server/package-lock.json
      - run: npm ci
      - run: npm test
