name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Los tests de Hi-Fi/ecualizador y de waveform usan libmpv y ffmpeg reales.
      - name: Dependencias nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev mpv ffmpeg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux-smoke:
    name: Arranque real en Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación y pantalla virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config xvfb \
            libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # main() completo hasta el inicio de sesión, sin tocar la red.
      - run: tool/run_linux_smoke.sh

  windows:
    name: Windows (test + build)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

  android:
    name: Android (apk debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build apk --flavor phone --debug

  crotolink-server:
    name: crotolink-server (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crotolink-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crotolink-server/package-lock.json
      - run: npm ci
      - run: npm test
