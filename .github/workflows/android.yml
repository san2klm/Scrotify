name: Android Móvil (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Create Platform Wrapper
        run: |
          cp -r android/app/src /tmp/android_src_backup
          flutter create . --platforms=android --org=com.example
          cp -r /tmp/android_src_backup/* android/app/src/
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle 2>/dev/null || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Preparar instalador
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Scrotify-Android.apk
          ls -lh Scrotify-Android.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Scrotify-Android
          path: Scrotify-Android.apk
          retention-days: 30

      - name: Publicar en la release android-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Scrotify-Android.apk \
            --target "$GITHUB_SHA" \
            --title "Scrotify para Android Móvil (última compilación)" \
            --notes "APK para teléfonos y tablets Android compilado desde ${GITHUB_SHA::7}."
