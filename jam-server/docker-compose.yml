services:
  scrotify-jam:
    build: .
    container_name: scrotify-jam
    restart: unless-stopped
    environment:
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # solo para el primer arranque; luego se guarda el hash
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-none}     # none | cloudflare | forwarded
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
