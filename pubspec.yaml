name: navidrome_client
description: Cliente de música moderno para Navidrome (API Subsonic)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  http_parser: ^4.0.2
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  rxdart: ^0.27.7
  ffi: ^2.0.5
  path_provider: ^2.1.1
  json_annotation: ^4.8.1
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  just_audio: ^0.9.44
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  connectivity_plus: ^7.3.1
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.1.1
  archive: ^4.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  cryptography: ^2.9.0
  media_kit: ^1.2.0
  window_manager: ^0.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
