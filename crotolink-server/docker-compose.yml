services:
  crotolink:
    build: .
    container_name: crotolink
    restart: unless-stopped
    environment:
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # solo para el primer arranque; luego se guarda el hash
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-none}     # none | cloudflare | forwarded
      SOURCE_URL: ${SOURCE_URL:-}           # código de TU versión si la modificás (AGPL §13)
    volumes:
      - ./data:/data
    # Endurecimiento: sin privilegios extra ni capacidades del kernel.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Si el túnel/proxy corre en este mismo equipo, publica solo en loopback:
    # "127.0.0.1:8080:8080". Las cabeceras de proxy solo se aceptan desde
    # loopback o red privada.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
